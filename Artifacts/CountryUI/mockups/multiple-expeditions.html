<!doctype html><html lang="ja"><meta charset="utf-8"><title>複数遠征・配置案</title><style>*{box-sizing:border-box}body{margin:0;color:#eef0eb;font:18px Georgia,'Yu Mincho',serif;background:#52606b url('../assets/kingdom-clean.png') center/cover fixed}body:before{content:'';position:fixed;inset:0;background:#26323a88;z-index:-1}header{height:84px;background:#414b55ed;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #c5d3dc40}header b{font-size:25px}header span{color:#c9d3da}main{margin:38px auto;width:90%;max-width:1240px;background:#3e4a55f5;min-height:560px;box-shadow:0 12px 40px #18232c66}nav{display:flex;align-items:center;border-bottom:1px solid #b8cbd344;padding:0 24px;gap:32px}button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}nav button{padding:22px 8px;color:#bac6ce;border-bottom:3px solid transparent}nav button.active{color:#f0f1ec;border-color:#b4d4e4}nav .close{margin-left:auto}section{padding:26px 34px}h2{font-size:22px;margin:0 0 22px}.row{display:grid;grid-template-columns:1.2fr 1.6fr 1fr auto;align-items:center;gap:32px;padding:25px 0;border-bottom:1px solid #c0cdd330}.row b{font-size:24px}.row small{display:block;color:#c5d0d5;margin-top:9px;font-size:15px}.stage{color:#bbd7e7}.track{display:flex;gap:8px;margin-top:14px}.track i{height:4px;background:#8298a655;flex:1}.track i.on{background:#b6d5e4}.remaining strong{font-size:34px}.detail{padding:11px 22px;border:1px solid #bfd0da55;background:#7b919e22}footer{display:flex;justify-content:space-between;align-items:center;padding:26px 34px;color:#c1cdd4}footer button,.primary{background:#9b8b65aa;border:1px solid #d2bf8966;padding:13px 24px;color:#f4eddb}.hidden{display:none}.note{line-height:1.9;color:#cad6dc}.badge{background:#a8cddd22;color:#c4e2ee;padding:4px 9px;font-size:14px}.bottom{position:fixed;right:28px;bottom:24px;background:#455461f2;border:1px solid #c0d0d955;padding:14px 24px}.bottom strong{color:#c1deed}.toast{color:#d9c793;min-height:28px;padding:0 34px}</style>
<header><b>アルトリア王国</b><span>1年2月3日　 ▶ 時間経過中</span><span>人口 12,560　 税収 100　 国庫 380</span></header>

</section><section id="new" class="hidden"><h2>新しい遠征</h2><p class="note">ここから既存の「目的地 → メンバー」選択へ。<br>進行中の部隊を残したまま、別の部隊を編成する。</p><button class="primary" id="compose">目的地を選ぶ →</button></section><div class="toast" id="message"></div><footer><span>配置確認用の仮画面</span><span>遠征中 2部隊・8人　／　帰還報告 1件</span></footer></main><button class="bottom">⚑ 遠征　<strong>2部隊</strong>　<span class="badge">報告 1</span></button><script>document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['status','new'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==b.dataset.tab));document.getElementById('message').textContent=''});document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>document.getElementById('message').textContent=b.dataset.name+'：この位置から既存の部隊詳細・帰還報告を開く想定');document.querySelector('#compose').onclick=()=>document.getElementById('message').textContent='既存の目的地・メンバー選択を、この画面内に表示する想定';document.querySelector('.bottom').onclick=()=>{document.querySelector('main').style.display='block';document.querySelector('[data-tab="status"]').click()};document.querySelector('.close').onclick=()=>document.querySelector('main').style.display='none';</script></html>
