<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="施設への投資と月ごとの国家運営を試せるWarSimulationプロトタイプ">
  <title>国家画面 — WarSimulation</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23252b2d' stroke='%23c5ae78' stroke-width='4' d='M8 8h48v25c0 13-10 20-24 25C18 53 8 46 8 33V8Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/country.css">
  <!-- Remove this layer to restore the previous resource HUD styling. -->
  <link rel="stylesheet" href="css/resources-v2.css">
  <!-- Remove v3 alone to return to the v14 resource HUD. -->
  <link rel="stylesheet" href="css/resources-v3.css">
  <!-- Remove v4 alone to return to the v15 resource HUD. -->
  <link rel="stylesheet" href="css/resources-v4.css">
  <!-- Restore rollback/top-band-v5 copies to return to the immediately preceding layout. -->
  <link rel="stylesheet" href="css/top-band-v6.css">
  <script src="js/country.js" defer></script>
</head>
<body>
  <div class="game" aria-label="国家運営">
    <div class="world" aria-hidden="true"></div>
    <div class="hud" role="group" aria-label="常時表示の国家情報">
      <section class="hud-zone hud-time" aria-label="日付と時間操作">
        <div class="calendar"><div id="date" class="date"></div><button data-action="settings" class="settings-button" aria-label="設定・保存">⚙</button></div>
        <div id="time-controls" class="time-controls" aria-label="時間操作"></div>
      </section>
      <section class="hud-zone hud-state" aria-label="王国と命令の状況">
        <button class="realm" data-action="navigate-kingdom" aria-label="城下町へ戻る"><span class="crest" aria-hidden="true">♜</span><span class="realm-copy"><strong>アルトリア王国</strong><small>王領 1</small></span></button>
        <div class="empire-status" aria-label="強化命令と工事の件数">
          <span class="empire-stat"><small>計画</small><strong id="top-plan-count">0</strong><small>件</small></span>
          <span class="empire-stat"><small>工事</small><strong id="top-construction-count">0</strong><small>件</small></span>
        </div>
      </section>
      <section class="hud-zone hud-treasury" aria-label="国家資源">
        <div id="resources" class="resources"></div>
      </section>
    </div>
    <main id="view" tabindex="-1"></main>
    <div id="turn-command" class="turn-command"></div>
    <div class="command-dock" role="group" aria-label="王国の命令">
      <button data-action="navigate-kingdom" data-route="kingdom"><span aria-hidden="true">♜</span><b>城下町</b></button>
      <button data-action="navigate-facilities" data-route="facilities"><span aria-hidden="true">⚒</span><b>施設整備</b></button>
      <button data-action="navigate-plan" data-route="plan"><span aria-hidden="true">⚑</span><b>国家運営</b><span id="plan-count" class="badge" aria-hidden="true">0</span></button>
      <button data-action="navigate-history" data-route="history"><span aria-hidden="true">▤</span><b>国家記録</b></button>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
