<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>国家 — Country UI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#16191a;min-height:100svh;display:grid;place-items:center;color:#f2eee5;font-family:'Yu Mincho','Hiragino Mincho ProN',serif}
button{font:inherit;color:inherit;cursor:pointer}
.screen{width:min(100vw,177.7778svh);aspect-ratio:16/9;position:relative;container-type:inline-size;overflow:hidden;background:url('assets/kingdom.png') center/100% 100% no-repeat}
.hud{position:absolute;display:flex;align-items:center;background:linear-gradient(120deg,#252b2de8,#292d30dc);border:1px solid #a49b7c;box-shadow:0 .25cqw .5cqw #0005;clip-path:polygon(.7cqw 0,calc(100% - .7cqw) 0,100% .7cqw,100% calc(100% - .7cqw),calc(100% - .7cqw) 100%,.7cqw 100%,0 calc(100% - .7cqw),0 .7cqw)}
.top{top:2.5%;height:7.5%}
.identity{left:1.7%;width:36%;padding-left:6%;gap:1.2cqw}
.name{font-size:1.9cqw;white-space:nowrap;letter-spacing:.15cqw}
.date{font-size:1.35cqw;white-space:nowrap}
.time{font-size:1.05cqw;color:#d8d6ce;white-space:nowrap;display:flex;align-items:center;gap:.7cqw}
.sep{height:2.1cqw;width:1px;background:#aaa79677;flex-shrink:0}
.crest{position:absolute;left:1.7%;top:2.5%;width:4.9%;height:10.2%;filter:drop-shadow(0 .15cqw .15cqw #0009)}
.crest-shield{width:100%;height:100%;display:grid;place-items:center;background:#282e30;border:1px solid #c5ae78;clip-path:polygon(1% 1%,99% 1%,99% 49%,94% 66%,82% 80%,66% 91%,50% 99%,34% 91%,18% 80%,6% 66%,1% 49%)}
.crest-lion{width:3.2cqw;height:3.2cqw}
.resources{right:1.5%;width:32.2%;padding:.6cqw 1.2cqw;justify-content:space-between}
.resource{display:flex;align-items:center;gap:.65cqw}
.label{font-size:.95cqw;color:#d2cbb9}
.value{font-size:1.2cqw;line-height:1.3}
.icon{width:2.3cqw;height:2.3cqw;display:inline-block;flex-shrink:0;background-image:url('assets/country-icons.png');background-repeat:no-repeat;background-size:400% 300%;background-position:0 0}
.icon[data-icon="sun"]{background-position:33.3333% 0}
.icon[data-icon="coin"]{background-position:66.6667% 0}
.icon[data-icon="wood"]{background-position:100% 0}
.icon[data-icon="ore"]{background-position:0 50%}
.icon[data-icon="wheat"]{background-position:33.3333% 50%}
.icon[data-icon="land"]{background-position:66.6667% 50%}
.icon[data-icon="people"]{background-position:100% 50%}
.icon[data-icon="hall"]{background-position:0 100%}
.icon[data-icon="trade"]{background-position:33.3333% 100%}
.icon[data-icon="swords"]{background-position:66.6667% 100%}
.icon[data-icon="bell"]{background-position:100% 100%}
.flag-icon{background-image:url('assets/war-flag.png');background-size:contain;background-position:center;background-repeat:no-repeat}
.bottom{bottom:2.5%;height:7.7%}
.stats{left:1.3%;width:22.7%;justify-content:space-evenly}
.stat{display:flex;gap:1cqw;align-items:center}
.nav{left:31.5%;width:36.8%;justify-content:space-evenly;padding:0 .6cqw}
.nav button{border:0;background:transparent;display:flex;align-items:center;justify-content:center;gap:.8cqw;height:100%;flex:1;font-size:1.25cqw;transition:background .15s}
.nav button:hover,.nav button[aria-pressed=true]{background:#e6c38126}
.nav button:focus-visible,.notice:focus-visible{outline:2px solid #e6c381;outline-offset:-4px}
.notice{right:1.3%;width:24.8%;gap:.9cqw;padding:0 1.3cqw;font-size:1.25cqw}
.notice small{font-size:.92cqw;color:#d2cbb9}
.bell{position:relative;display:flex}
.badge{position:absolute;right:-.5cqw;top:-.5cqw;background:#c6423d;border-radius:50%;font:1cqw Georgia;padding:.12cqw .36cqw}
.arrow{margin-left:auto;font-size:2cqw;color:#e6c381}
.toast{position:absolute;right:1.5%;bottom:12%;padding:1cqw 1.5cqw;background:#252b2df2;border:1px solid #a49b7c;font-size:1.1cqw}
.toast[hidden]{display:none}
</style>
<main class="screen" aria-label="国家の概要">
<header class="hud top identity"><span class="name">国家名</span><i class="sep"></i><span class="date">1月1日</span><i class="sep"></i><span class="time"><span class="icon" data-icon="sun" aria-hidden="true"></span>時間経過中</span></header>
<div class="crest" aria-label="国章"><span class="crest-shield"><span class="icon crest-lion" data-icon="lion" aria-hidden="true"></span></span></div>
<section class="hud top resources" aria-label="資源"></section>
<section class="hud bottom stats" aria-label="国家状態"><div class="stat"><span class="icon" data-icon="land" aria-hidden="true"></span><div><div class="label">領土</div><div class="value">248</div></div></div><i class="sep"></i><div class="stat"><span class="icon" data-icon="people" aria-hidden="true"></span><div><div class="label">人口</div><div class="value">12,560</div></div></div></section>
<nav class="hud bottom nav" aria-label="国家メニュー"></nav>
<button class="hud bottom notice" aria-expanded="false"><span class="bell"><span class="icon" data-icon="bell" aria-hidden="true"></span><span class="badge">3</span></span>通知<i class="sep"></i><small>新たな報告があります</small><span class="arrow">›</span></button>
<div class="toast" role="status" hidden></div>
</main>
<script>
const resources=[['coin','資金','12,345'],['wood','木材','8,230'],['ore','鉱石','6,780'],['wheat','食料','9,410']];
document.querySelector('.resources').innerHTML=resources.map(([icon,label,value])=>`<div class="resource"><span class="icon" data-icon="${icon}" aria-hidden="true"></span><div><div class="label">${label}</div><div class="value">${value}</div></div></div>`).join('<i class="sep"></i>');
document.querySelector('.nav').innerHTML=[['hall','運営'],['trade','貿易'],['swords','部隊'],['flag','戦況']].map(([icon,label])=>`<button type="button" aria-pressed="false"><span class="icon ${icon==='flag'?'flag-icon':''}" ${icon==='flag'?'':'data-icon="'+icon+'"'} aria-hidden="true"></span>${label}</button>`).join('<i class="sep"></i>');
document.querySelectorAll('.nav button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));
const notice=document.querySelector('.notice'),toast=document.querySelector('.toast');notice.addEventListener('click',()=>{toast.hidden=!toast.hidden;toast.textContent='通知 3件 — 新たな報告があります';notice.setAttribute('aria-expanded',String(!toast.hidden));});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){toast.hidden=true;notice.setAttribute('aria-expanded','false');}});
</script>
</html>
